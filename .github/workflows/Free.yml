
name: JALORA CLOUD PC

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Windows Information
        shell: pwsh
        run: |
          Get-ComputerInfo |
          Select-Object WindowsProductName,
          WindowsVersion, OsArchitecture

      - name: CPU Information
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor |
          Select-Object Name, NumberOfCores

      - name: RAM Information
        shell: pwsh
        run: |
          Get-CimInstance Win32_ComputerSystem |
          Select-Object @{
            Name="RAM_GB"
            Expression={[math]::Round(
              $_.TotalPhysicalMemory / 1GB, 2
            )}
          }

      - name: Storage Information
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem

      - name: Private IP Address
        shell: pwsh
        run: |
          Get-NetIPAddress -AddressFamily IPv4 |
          Where-Object {
            $_.IPAddress -notlike "127.*"
          } |
          Select-Object InterfaceAlias, IPAddress

      - name: Network Information
        shell: pwsh
        run: |
          ipconfig

      - name: System Check
        run: |
          Write-Host "JALORA CLOUD PC"
          Write-Host "Windows Runner Started!"

