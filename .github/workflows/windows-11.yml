      - name: Get Device ID
        shell: pwsh
        run: |
          Write-Host "COMPUTER NAME:"
          hostname

          Write-Host "DEVICE UUID:"
          Get-CimInstance Win32_ComputerSystemProduct |
          Select-Object -ExpandProperty UUID

          Write-Host "WINDOWS MACHINE GUID:"
          Get-ItemPropertyValue `
            -Path "HKLM:\SOFTWARE\Microsoft\Cryptography" `
            -Name MachineGuid
